[project]
name = "hfff"
version = "0.1.0"
description = "Hierarchical Fine-grained Fusion with Temporally Anchored Queries for Multimodal Sentiment Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=17.0.0",
    "httpx[socks]>=0.28.1",
    "insightface>=2.1",
    "librosa>=0.11.0",
    "lightning>=2.6.1",
    "mlflow>=3.10.1",
    "onnxruntime-gpu==1.31.0",
    "opencv-python>=4.13.0.92",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.3.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv]
exclude-dependencies = ["onnxruntime"]
